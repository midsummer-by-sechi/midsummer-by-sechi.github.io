<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>이안의 SNS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital,wght@1,600&display=swap">
<style id="app-style">
/* Layout: a single phone-width app column (max 480px): sticky top bar, scrolling view (home feed / search / profile / me), fixed bottom tab bar. */
:root{
  --bg:#ffffff; --fg:#14161b; --muted:#6c7079; --line:#e6e7eb; --soft:#f2f3f5;
  --accent:#1d6f8a; --ring:#e8735a; --heart:#e5484d; --navy:#1f3b8f; --baby:#a8d5f7; --dm:#3d6be0;
  --overlay:rgba(10,12,18,.62); --glass:rgba(255,255,255,.72); --glass-line:rgba(0,0,0,.06); --glass-on:rgba(0,0,0,.07);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --tab:54px;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --logo:"Playfair Display",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f13; --fg:#eceef2; --muted:#9097a3; --line:#252930; --soft:#181b21;
  --accent:#4cb3cf; --ring:#f08a70; --heart:#ff5c63; --navy:#9db8ff; --dm:#5b86f0; --overlay:rgba(0,0,0,.72); --glass:rgba(28,30,36,.72); --glass-line:rgba(255,255,255,.08); --glass-on:rgba(255,255,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --fg:#eceef2; --muted:#9097a3; --line:#252930; --soft:#181b21;
  --accent:#4cb3cf; --ring:#f08a70; --heart:#ff5c63; --navy:#9db8ff; --dm:#5b86f0; --overlay:rgba(0,0,0,.72); --glass:rgba(28,30,36,.72); --glass-line:rgba(255,255,255,.08); --glass-on:rgba(255,255,255,.12); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:480px;margin:0 auto;padding-bottom:calc(var(--tab) + 48px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.shell{border-inline:1px solid var(--line);min-height:100vh}}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);height:52px;display:flex;align-items:center;gap:6px;padding-left:var(--gl);padding-right:var(--gr)}
.top.line{border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--logo);font-style:italic;font-weight:600;font-size:27px;letter-spacing:-.01em;background:none;border:0;padding:0;line-height:1;color:var(--fg);display:flex;align-items:center;gap:4px}
.wordmark small{font-family:var(--font);font-style:normal;font-size:14px;font-weight:400;opacity:.8}
.top.center{display:grid;grid-template-columns:1fr auto 1fr}
.top.center .tl{display:flex;justify-content:flex-start}
.top.center .tr{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.hasdot{position:relative}
.rdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--heart);border:1.5px solid var(--bg)}
.top h1{font-size:17px;font-weight:700;margin:0 auto 0 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:0;padding:6px;color:var(--fg);display:grid;place-items:center;border-radius:8px}
.deco{padding:6px;display:grid;place-items:center;color:var(--fg)}
.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;margin-right:4px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--heart)}
.btn:disabled{opacity:.5;cursor:default}
.mention{color:var(--navy);text-decoration:none;font-weight:500}
.uname{background:none;border:0;padding:0;font-weight:700;color:var(--fg);text-align:left}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;width:74px}
.story .lbl{font-size:11.5px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:72px;height:72px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ffc06b,#ff7a59 45%,#e0569a);display:grid;place-items:center}
.ring>.av{box-shadow:0 0 0 3px var(--bg)}
.ring.none{background:none}
.ring.none>.av{box-shadow:none}
.badge{position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);border:2.5px solid var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;flex:0 0 auto}
.av.me{background:var(--baby)}
/* feed */
.card{border-bottom:1px solid var(--line);padding-bottom:12px}
.ch{display:flex;align-items:center;gap:10px;padding:10px var(--gr) 10px var(--gl)}
.ch .h{font-weight:700;font-size:13.5px;line-height:1.2}
.ch .loc{font-size:12px;color:var(--muted);line-height:1.3}
.ch .x{margin-left:auto}
.media{position:relative;aspect-ratio:4/5;max-width:100%;background:#000}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-size:17px;display:grid;place-items:center}
.nav.l{left:10px}.nav.r{right:10px}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;justify-content:center;padding-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.acts{display:flex;gap:14px;padding:8px var(--gr) 4px var(--gl);align-items:center}
.acts button{background:none;border:0;padding:0;color:var(--fg);display:grid}
.acts .liked{color:var(--heart)}
.pb{padding:0 var(--gr) 0 var(--gl)}
.likes{font-weight:700;font-variant-numeric:tabular-nums}
.cap{white-space:pre-wrap;word-break:break-word;margin:3px 0}
.date{color:var(--muted);font-size:12px;margin-top:4px}
.more{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;margin-top:2px;display:block}
.cm{display:flex;gap:6px;align-items:flex-start;margin-top:4px}
.cm p{margin:0;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.cm .del{background:none;border:0;color:var(--muted);font-size:12px;padding:0 2px}
/* profile */
.prof{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-top:14px;padding-bottom:10px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.counts>*{background:none;border:0;padding:0;color:var(--fg)}
.counts b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.counts small{color:var(--muted);font-size:12.5px}
.who{padding-bottom:12px}
.who .nm{font-weight:700}
.who .bio{white-space:pre-wrap;word-break:break-word;margin:2px 0 0}
.who .lnk{color:var(--navy);text-decoration:none;word-break:break-all}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:14px}
.pbtn{border:0;border-radius:8px;background:var(--soft);padding:7px 0;font-size:13px;font-weight:600;text-align:center;color:var(--fg)}
.tabline{border-top:1px solid var(--line);display:flex;justify-content:center;padding-block:10px;color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;background:var(--soft);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .multi{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile.new{display:grid;place-items:center;color:var(--muted);border:1.5px dashed var(--line);background:none;font-size:13px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
.empty .cam{width:62px;height:62px;border:2px solid var(--fg);border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:var(--fg)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}
/* story viewer */
.ring.seen{background:#c7c9ce}
.ring.nost{background:none}
.ring.nost>.av{box-shadow:0 0 0 1px var(--line)}
.sv{position:fixed;inset:0;z-index:40;background:#000;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sv .st{position:relative;width:100%;max-width:480px;height:100%;background:#111;overflow:hidden;cursor:pointer}
.sv .simg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.sv .st::before{content:"";position:absolute;inset:0 0 auto;height:120px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:1;pointer-events:none}
.sv .bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:3px;z-index:2;transition:opacity .2s}
.sv .bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv .bars i b{display:block;height:100%;width:0;background:#fff}
.sv .shd{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:12px;right:6px;display:flex;align-items:center;gap:8px;color:#fff;z-index:2;font-size:14px;transition:opacity .2s}
.sv .shd b{font-weight:600}
.sv .shd small{opacity:.75}
.sv .sx{margin-left:auto;background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:4px 10px}
.sv .stxt{position:absolute;left:18px;right:18px;bottom:16%;text-align:center;z-index:2;pointer-events:none;transition:opacity .2s}
.sv .stxt span{background:rgba(0,0,0,.5);color:#fff;padding:5px 12px;border-radius:8px;font-size:18px;font-weight:600;line-height:1.6;white-space:pre-wrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sv.hold .bars,.sv.hold .shd{opacity:0}
.sedit{display:grid;gap:10px}
.sitem{display:grid;grid-template-columns:64px 1fr;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px}
.sitem img{width:64px;height:100px;object-fit:cover;border-radius:6px}
.sitem .sf{display:grid;gap:6px}
.sitem .sb{display:flex;gap:6px;flex-wrap:wrap}
/* explore + notifications */
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc(min(480px,100vw)/3*1.33);grid-auto-flow:dense;gap:2px}
.xgrid .tile{aspect-ratio:auto;height:100%}
.xgrid .tile.tall{grid-row:span 2}
.cancel{background:none;border:0;padding:6px 2px 6px 8px;font-size:15px;font-weight:600;color:var(--fg)}
.nrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:9px var(--gr) 9px var(--gl);text-align:left;color:var(--fg)}
.nrow .nt{flex:1;min-width:0;font-size:14px;line-height:1.4;word-break:break-word}
.nrow .nt small{color:var(--muted);font-size:13px;margin-left:4px}
.nrow .th{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:0 0 auto}
.music{font-size:12px;line-height:1.3;display:flex;align-items:center;gap:4px}
/* search + lists */
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:0 12px;height:38px;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;color:var(--fg)}
.sec{font-weight:700;font-size:15px;padding-top:14px;padding-bottom:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:8px var(--gr) 8px var(--gl);text-align:left;color:var(--fg)}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{border-radius:8px;background:var(--soft);padding:5px 12px;font-size:13px;font-weight:600}
/* tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:12;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--glass-line);border-radius:34px;box-shadow:0 8px 28px -10px rgba(0,0,0,.28);display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 8px}
.tabbar .ib,.tabbar .deco{padding:0;width:62px;height:48px;border-radius:24px;display:grid;place-items:center}
.tabbar .ib.cur{background:var(--glass-on)}
.tabme{width:28px;height:28px;border-radius:50%;background:var(--baby);display:block;box-shadow:0 0 0 2px var(--bg)}
.on .tabme{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.tabav{display:inline-flex;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}.tabav .av{width:28px!important;height:28px!important;font-size:12px!important}
.on .tabav{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.sv .sbg{position:absolute;inset:0}
.row.unread .t b,.row.unread .t span{font-weight:700;color:var(--fg)}
.row .udot{width:9px;height:9px;border-radius:50%;background:#3797f0;margin-left:auto;flex:none}
.unbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px;font-size:13px;color:var(--muted)}
.sv .shcard{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:9/16;transform:translate(-50%,-50%);border-radius:14px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:1;background:#222}
.shcard>img,.shcard>.shbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shcard .shtx{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-weight:700;font-size:17px;white-space:pre-wrap;line-height:1.5;word-break:keep-all}
.shcard .shtx.low{top:auto;bottom:12%;transform:none}
.shcard .shtx.low span{background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.shcard .mention{color:#fff;background:rgba(255,255,255,.25);border-radius:5px;padding:0 4px;text-decoration:none}
.shcard .shby{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.shcard .shby .av{box-shadow:0 0 0 1.5px #fff}
.sv .stxt.share{bottom:8%}
.sitem .sth.sh{position:relative;padding:0}.sitem .sth.sh i{position:absolute;left:12px;right:12px;top:18px;bottom:18px;border-radius:5px;transform:rotate(-3deg);background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}.sitem .sth.sh b{position:absolute;bottom:2px;left:0;right:0;font-size:10px}
.sv .stxt.mid{bottom:auto;top:50%;transform:translateY(-50%)}
.sv .stxt.mid span{background:none;font-size:26px;line-height:1.5}
.sv .stxt .mention{color:#fff;background:rgba(255,255,255,.22);border-radius:6px;padding:0 6px;text-decoration:none;font-weight:700}
.sitem .sth{width:64px;height:100px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;text-align:center;padding:4px;overflow:hidden}
.dmedit{display:flex;gap:6px;align-items:center}.dmedit select{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);color:var(--fg)}
.msg .x{border:0;background:none;color:var(--heart);font-size:12px;align-self:center}
.msg .g{border:0;background:none;color:var(--muted);font-size:12px;align-self:center}
.dgap{min-height:30px;padding:10px 0 4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.dgap input{width:210px;text-align:center;font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);color:var(--fg)}
/* overlay sheets */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding-bottom:14px}
.edrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px var(--gr) 0 var(--gl)}
.cmadd{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-top:10px}
.cmadd input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;min-width:0}
form.f{padding:16px;display:grid;gap:12px}
form.f h2{margin:0;font-size:16px}
.f label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:14px;width:100%;min-width:0}
.f textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs div{position:relative;width:72px;height:72px}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:13px;line-height:1}
.thumbs .mv{left:-6px;right:auto}
.frow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
/* direct messages */
.dmhead{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.dmhead b{display:block;font-size:15px;line-height:1.2}
.dmhead span{display:block;font-size:12px;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:6px;padding:16px var(--gr) 16px var(--gl);min-height:calc(100vh - 200px)}
.intro{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 0 22px;color:var(--muted);font-size:13px}
.intro b{color:var(--fg);font-size:17px;margin-top:6px}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:80%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{border-radius:20px;padding:8px 14px;white-space:pre-wrap;word-break:break-word;background:var(--soft);color:var(--fg)}
.msg.me .bub{background:var(--dm);color:#fff}
.fail{color:var(--heart);font-size:11.5px;align-self:flex-end;text-align:right;margin-top:-2px}
.typing{color:var(--muted);font-size:13px;padding-left:36px}
.composer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:12;background:var(--bg);padding:8px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl)}
.composer form{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 16px}

const SECRET_B=['매일','매일매일','every day','everyday','毎日','每天'];

const normT=x=>String(x||'').toLowerCase().replace(/[ㅠㅜ]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
function secretReply(t,nb){const mine=t.filter(m=>m.me).map(m=>m.text);const n=mine.length;if(n<nb+2)return[];
  const A=SECRET_A.map(normT),Bm=SECRET_B.map(normT);if(!Bm.includes(normT(mine[n-1]))||!A.includes(normT(mine[n-2])))return[];
  const R=SECRET_R.map(T);if(t.some(m=>!m.me&&(R.includes(m.text)||SECRET_R.includes(m.text))))return[];return R}

function sendDm(text){
  const a=acctById(ui.acct);if(!a||!text)return;
  const t=ui.dms[a.id]=ui.dms[a.id]||[];
  const dm=a.dm||{mode:'reply',reply:''};
  if(dm.mode==='blocked'){t.push({me:true,text,failed:true});saveDms();ui.alert=T('메세지를 전송할 수 없습니다.');render();return}
  if(SB&&a.id===DM_REMOTE){sendRemoteDm(a,text);return}
  t.push({me:true,text});saveDms();
  const B=(dm.bundles||[]).filter(x=>x&&x.length);
  if(B.length){const id=a.id;const step=ui.dmStep[id]||0;
    if(step<B.length){ui.dmStep[id]=step+1;try{localStorage.setItem(LS+'sns-dmstep-v1',JSON.stringify(ui.dmStep))}catch(e){}
      const lines=B[step].slice();const wait=ms=>new Promise(r=>setTimeout(r,ms));
      ui.dmq=(ui.dmq||Promise.resolve()).then(async()=>{await wait(700);for(let n=0;n<lines.length;n++){ui.typing=id;render();await wait(n?1100:1500);ui.typing=null;(ui.dms[id]=ui.dms[id]||[]).push({me:false,text:lines[n]});saveDms();render()}})}
    render();return}
  if(dm.reply){ui.typing=a.id;render();const id=a.id;
    setTimeout(()=>{ui.typing=null;(ui.dms[id]=ui.dms[id]||[]).push({me:false,text:dm.reply});saveDms();render()},1100)}
  else render();
}

function openStory(id,i){const a=acctById(id);if(!a||!a.stories.length)return;const ord=storyAccts().map(x=>x.id);const k0=ord.indexOf(id);ui.story={acct:id,i:i||0,el:0,paused:false,last:0,order:k0>=0?ord.slice(k0):[id]};ui.post=null;render();startStory()}
function closeStory(){ui.story=null;if(ui.raf)cancelAnimationFrame(ui.raf);render()}
function markSeen(){const S=ui.story;if(!S)return;const a=acctById(S.acct);const st=a&&a.stories[S.i];if(st&&!ui.seenSt.has(st.id)){ui.seenSt.add(st.id);saveSeen()}}
function stepStory(dir){
  const S=ui.story;if(!S)return;const a=acctById(S.acct);
  if(dir>0){if(S.i<a.stories.length-1){S.i++}else{const list=S.order;const k=list.indexOf(S.acct);
      const nxt=list.slice(k+1).find(id=>id!==S.acct);if(nxt&&acctById(nxt)&&acctById(nxt).stories.length){S.acct=nxt;S.i=0}else{closeStory();return}}}
  else{if(S.i>0)S.i--;else{const list=S.order;const k=list.indexOf(S.acct);if(k>0){S.acct=list[k-1];S.i=acctById(S.acct).stories.length-1}}}
  S.el=0;S.last=0;render();startStory();
}
function startStory(){
  if(ui.raf)cancelAnimationFrame(ui.raf);markSeen();bindStory();
  const loop=ts=>{const S=ui.story;if(!S)return;const a=acctById(S.acct);const st=a.stories[S.i];const dur=(+st.dur||5)*1000;
    if(S.last&&!S.paused&&!document.hidden)S.el+=ts-S.last;S.last=ts;
    const bar=document.getElementById('svbar');if(bar)bar.style.width=Math.min(100,S.el/dur*100)+'%';
    if(S.el>=dur){stepStory(1);return}
    ui.raf=requestAnimationFrame(loop)};
  ui.raf=requestAnimationFrame(loop);
}
function bindStory(){
  const st=document.getElementById('svst'),sv=document.getElementById('sv');if(!st)return;
  let down=0,downX=0;
  st.onpointerdown=e=>{if(e.target.closest('[data-act]'))return;down=performance.now();downX=e.clientX;ui.story.paused=true;sv.classList.add('hold');try{st.setPointerCapture(e.pointerId)}catch(_){}};
  const up=e=>{if(!down)return;const held=performance.now()-down;down=0;if(!ui.story)return;ui.story.paused=false;sv.classList.remove('hold');
    if(held<220){const r=st.getBoundingClientRect();stepStory(downX-r.left<r.width/3?-1:1)}};
  st.onpointerup=up;st.onpointercancel=()=>{down=0;if(ui.story){ui.story.paused=false;sv.classList.remove('hold')}};
  st.oncontextmenu=e=>e.preventDefault();
}

async function toDataURL(file,max){
  const url=URL.createObjectURL(file);
  try{const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});
    const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8);
  }finally{URL.revokeObjectURL(url)}
}

  const sf=$('#sf');if(sf){sf.onsubmit=e=>{e.preventDefault();readForm();commitStories();render()};
    document.querySelectorAll('[data-sfimg]').forEach(inp=>inp.onchange=async ev=>{const f=ev.target.files[0];if(!f)return;readForm();const it=ui.draft.list[+inp.dataset.sfimg];try{const id='i'+uid();state.images[id]=await toDataURL(f,720);it.img=id}catch(err){}render()});
    $('#sf-files').onchange=async ev=>{const fs=[...ev.target.files];if(!fs.length)return;readForm();ui.sheet.status='사진을 준비하는 중…';render();for(const f of fs){try{const id='i'+uid();state.images[id]=await toDataURL(f,720);ui.draft.list.push({id:'s'+uid(),img:id,dur:5,time:'방금',text:''})}catch(err){}}ui.sheet.status='';render()}}
  const dmf=$('#dmf');if(dmf)dmf.onsubmit=e=>{e.preventDefault();const i=$('#dm-text');const v=i.value.trim();if(!v)return;i.value='';
    if(ui.edit){const w=$('#dm-who');(state.threads[ui.acct]=state.threads[ui.acct]||[]).push({me:!w||w.value==='me',text:v});changed();render();return}sendDm(v)};
  const pf=$('#pf');if(pf){
    pf.onsubmit=e=>{e.preventDefault();readForm();if(!ui.draft.handle){$('#pf-handle').focus();return}
      if(ui.sheet.type==='newAcct'){let id=(ui.draft.handle.replace(/[^A-Za-z0-9_~-]/g,'')||'acct').toLowerCase();if(RESERVED.includes(id))id+='1';while(acctById(id))id+='1';state.accounts.push({...ui.draft,id,posts:[]});ui.sheet=null;ui.draft=null;changed();go('profile',id);return}
      Object.assign(acctById(ui.sheet.id||ui.acct),ui.draft);ui.sheet=null;ui.draft=null;changed();render()};
    $('#pf-av').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;readForm();const id='i'+uid();state.images[id]=await toDataURL(f,320);ui.draft.avatar=id;render()}}
  const lf=$('#lf');if(lf)lf.onsubmit=e=>{e.preventDefault();const v=$('#lf-app').value.trim();if(v)state.appName=v;ui.sheet=null;ui.draft=null;changed();render()};
  const nf=$('#nf');if(nf)nf.onsubmit=e=>{e.preventDefault();readForm();const d=ui.draft;if(!d.from){$('#nf-from').focus();return}if(d.id){Object.assign(state.notifs.find(n=>n.id===d.id),d)}else state.notifs.unshift({...d,id:'n'+uid()});ui.sheet=null;ui.draft=null;ui.armed=null;changed();render()};
  const mf=$('#mf');if(mf){mf.onsubmit=e=>{e.preventDefault();readForm();const d=ui.draft;if(!d.handle){$('#mf-handle').focus();return}
    state.appName=d.appName||state.appName;state.me={handle:d.handle,name:d.name,bio:d.bio,followers:d.followers};ui.sheet=null;ui.draft=null;changed();render()}}
  const ptf=$('#ptf');if(ptf){
    ptf.onsubmit=e=>{e.preventDefault();readForm();const d=ui.draft;
      if(!d.images.length){ui.sheet.status='사진을 한 장 이상 넣어 주세요.';render();return}
      const p={id:d.id||'p'+uid(),images:d.images,caption:d.caption,date:d.date,likes:String(d.likes).replace(/[^0-9]/g,'')||'0',location:d.location,music:d.music||'',comments:d.comments||[]};
      if(ui.sheet.edit){const [a]=findPost(p.id);const k=a.posts.findIndex(x=>x.id===p.id);a.posts[k]=p}
      else{const a=acctById(d.acct)||state.accounts[0];if(!a){ui.sheet.status='먼저 계정을 만들어 주세요.';render();return}a.posts.push(p)}
      ui.sheet=null;ui.draft=null;ui.post=p.id;changed();render()};
    $('#pt-files').onchange=async ev=>{const fs=[...ev.target.files];if(!fs.length)return;readForm();ui.sheet.status='사진을 준비하는 중…';render();
      for(const f of fs){try{const id='i'+uid();state.images[id]=await toDataURL(f,720);ui.draft.images.push(id)}catch(err){}}
      ui.sheet.status='';render()}}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&(e.target.id==='rc-text'||e.target.id==='cm-text')){e.preventDefault();act(e.target.id==='rc-text'?'addMine':'addCm')}});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&!ui.searching){ui.searching=true;const r=$('#results');if(r)r.innerHTML=resultsHTML();const c=$('#qcancel');if(c)c.hidden=false;document.querySelectorAll('.top .pill').forEach(x=>x.hidden=true)}});
document.addEventListener('change',e=>{const g=e.target.closest&&e.target.closest('[data-gapi]');if(g){const L=state.threads[ui.acct]||[];const m=L[+g.dataset.gapi];if(m){m.gap=g.value.trim()||true;changed();render()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const r=$('#results');if(r)r.innerHTML=resultsHTML()}});
document.addEventListener('click',e=>{
  const ov=e.target.closest('.ov[data-close]');if(ov&&e.target===ov){ui.post=null;ui.armed=null;render();return}
  const t=e.target.closest('[data-act],[data-go],[data-dm],[data-delmine],[data-h],[data-open],[data-like],[data-prev],[data-next],[data-delcm],[data-rmimg],[data-first]');
  if(!t||!$('#app').contains(t))return;
  const ds=t.dataset;
  if(ds.h!==undefined){e.preventDefault();openHandle(ds.h);return}
  if(ds.go){ui.post=null;go('profile',ds.go);return}
  if(ds.dm){if(!ui.edit&&(state.unread||{})[ds.dm]){ui.readDm[ds.dm]=true;try{localStorage.setItem(LS+'sns-dmread-v1',JSON.stringify(ui.readDm))}catch(e){}}go('dm',ds.dm);return}
  if(ds.open){ui.post=ds.open;ui.armed=null;render();return}
  if(ds.like){ui.liked.has(ds.like)?ui.liked.delete(ds.like):ui.liked.add(ds.like);render();return}
  if(ds.prev){ui.idx[ds.prev]=Math.max(0,(ui.idx[ds.prev]||0)-1);render();return}
  if(ds.next){ui.idx[ds.next]=(ui.idx[ds.next]||0)+1;render();return}
  if(ds.delmine){delCm(ds.delmine);return}
  if(ds.delcm){const [,p]=findPost(ui.post);p.comments=p.comments.filter(c=>c.id!==ds.delcm);changed();render();return}
  if(ds.rmimg){readForm();ui.draft.images.splice(+ds.rmimg,1);render();return}
  if(ds.first){readForm();const [x]=ui.draft.images.splice(+ds.first,1);ui.draft.images.unshift(x);render();return}
  act(ds.act,ds);
});
function act(a,ds){ds=ds||{};
  switch(a){
    case 'toggleEdit':ui.edit=!ui.edit;ui.armed=null;break;
    case 'toTop':window.scrollTo({top:0,behavior:'smooth'});return;
    case 'goHome':if(ui.view==='home'){window.scrollTo({top:0,behavior:'smooth'});return}go('home');return;
    case 'goSearch':ui.searching=false;ui.q='';go('search');return;
    case 'goMe':go('me');return;
    case 'goFollowing':go('following');return;
    case 'goInbox':ui.inboxSeen=true;try{localStorage.setItem(LS+'sns-inbox-seen','1')}catch(e){}go('inbox');return;
    case 'goNotif':ui.notifSeen=true;try{localStorage.setItem(LS+'sns-notif-seen','1')}catch(e){}go('notif');return;
    case 'cancelSearch':ui.searching=false;ui.q='';break;
    case 'newNotif':ui.draft={from:'',time:'방금',text:'님이 회원님의 게시물을 좋아합니다.',post:''};ui.sheet={type:'notif'};ui.armed=null;break;
    case 'editNotif':{const n=state.notifs.find(x=>x.id===ds.id);if(!n)return;ui.draft={...n};ui.sheet={type:'notif'};ui.armed=null;break}
    case 'delNotif':if(ui.armed!=='notif'){readForm();ui.armed='notif';break}state.notifs=state.notifs.filter(n=>n.id!==ui.draft.id);ui.sheet=null;ui.draft=null;ui.armed=null;changed();break;
    case 'openDm':go('dm',ui.acct);return;
    case 'gapTh':{const L=state.threads[ui.acct]||[];const m=L[+ds.i];if(m){if(m.gap)delete m.gap;else m.gap=true;changed()}break}
    case 'delTh':{const L=state.threads[ui.acct]||[];L.splice(+ds.i,1);changed();break}
    case 'toggleUnread':{state.unread=state.unread||{};if(state.unread[ui.acct])delete state.unread[ui.acct];else state.unread[ui.acct]=true;changed();break}
    case 'dmRestart':if(ui.armed!=='dmr'){ui.armed='dmr';break}restartDm();return;
    case 'openLang':ui.langOpen=true;break;
    case 'closeLang':ui.langOpen=false;break;
    case 'setLang':setLang(ds.l);return;
    case 'closeAlert':ui.alert=null;break;
    case 'addMine':{const au=$('#rc-author').value.trim().replace(/\s+/g,''),tx=$('#rc-text').value.trim();if(!au||!tx){(au?$('#rc-text'):$('#rc-author')).focus();return}
      ui.rname=au;try{localStorage.setItem(LS+'sns-rname',au)}catch(e){}postCm(ui.post,au,tx);return}
    case 'back':back();return;
    case 'closePost':ui.post=null;ui.armed=null;break;
    case 'addCm':{const au=$('#cm-author').value.trim(),tx=$('#cm-text').value.trim();if(!au||!tx){(au?$('#cm-text'):$('#cm-author')).focus();return}
      ui.lastAuthor=au;findPost(ui.post)[1].comments.push({id:'c'+uid(),author:au,text:tx});changed();break}
    case 'editProfile':{const x=acctById(ds.id||ui.acct);ui.draft={handle:x.handle,name:x.name||'',bio:x.bio||'',followers:x.followers||'',following:x.following||'',link:x.link||'',avatar:x.avatar||'',dmHide:!!x.dmHide,dm:{...(x.dm||{mode:'reply',reply:''})}};ui.sheet={type:'profile',id:x.id};ui.armed=null;break}
    case 'editLogo':ui.draft={appName:state.appName};ui.sheet={type:'logo'};break;
    case 'editMe':ui.draft={...state.me,appName:state.appName};ui.sheet={type:'me'};break;
    case 'newAcct':ui.draft={handle:'',name:'',bio:'',followers:'0',following:'0',link:'',avatar:'',dm:{mode:'reply',reply:''}};ui.sheet={type:'newAcct'};break;
    case 'delAcctAsk':if(ui.armed!=='acct'){ui.armed='acct';break}
      state.accounts=state.accounts.filter(x=>x.id!==ui.acct);ui.armed=null;changed();ui.stack=[];ui.view='home';ui.acct=null;setHash();break;
    case 'newPost':ui.draft={acct:ui.view==='profile'?ui.acct:ui.view==='me'&&state.meId?state.meId:(state.accounts[0]||{}).id,images:[],caption:'',date:new Date().toISOString().slice(0,10),likes:'0',location:'',comments:[]};ui.sheet={type:'post'};break;
    case 'editPost':{const [,p]=findPost(ui.post);ui.draft={...p,images:[...p.images]};ui.sheet={type:'post',edit:true};break}
    case 'delPost':if(ui.armed!=='post'){ui.armed='post';break}
      {const [x]=findPost(ui.post);x.posts=x.posts.filter(p=>p.id!==ui.post);ui.post=null;ui.armed=null;changed();break}
    case 'cancelSheet':ui.sheet=null;ui.draft=null;ui.armed=null;break;
    case 'openStory':openStory(ds.id);return;
    case 'closeStory':closeStory();return;
    case 'editStories':{const x=acctById(ds.id);ui.draft={acct:x.id,list:(x.stories||[]).map(t=>({...t}))};ui.sheet={type:'stories'};break}
    case 'stUp':{readForm();const i=+ds.i;const L=ui.draft.list;[L[i-1],L[i]]=[L[i],L[i-1]];break}
    case 'stAddShare':readForm();ui.draft.list.push({id:'s'+uid(),share:'',img:'',sbg:'#f2a7b8',stext:'',bg:'#2b2b2b',dur:5,time:'방금',text:'ㄳ'});break;
    case 'stNoImg':readForm();ui.draft.list[+ds.i].img='';break;
    case 'stAddText':readForm();ui.draft.list.push({id:'s'+uid(),img:'',bg:'#1f2a44',dur:5,time:'방금',text:''});break;
    case 'stDel':readForm();ui.draft.list.splice(+ds.i,1);break;
    case 'stPreview':{readForm();const id=ui.draft.acct;commitStories();if(acctById(id).stories.length)openStory(id);else render();return}
    case 'save':save();return;
    default:return;
  }
  render();
}

/* ---------- save ---------- */
function gcImages(){
  const used=new Set();state.accounts.forEach(a=>{if(a.avatar)used.add(a.avatar);a.posts.forEach(p=>p.images.forEach(i=>used.add(i)));(a.stories||[]).forEach(t=>used.add(t.img))});
  if(ui.draft){if(ui.draft.avatar)used.add(ui.draft.avatar);(ui.draft.images||[]).forEach(i=>used.add(i));(ui.draft.list||[]).forEach(t=>used.add(t.img))}
  Object.keys(state.images).forEach(k=>{if(!used.has(k))delete state.images[k]});
}
function buildDoc(){
  const json=JSON.stringify({...state,savedAt:new Date().toISOString()}).replace(/</g,'\\u003c');
  return SKELETON+TOP_HTML+'<style id="app-style">'+STYLE+'</style>\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-script">'+SCRIPT+'<\/script></body></html>';
}
async function save(){
  if(!ui.art||ui.saving)return;
  gcImages();const doc=buildDoc();
  if(doc.length>15.5e6){ui.msg='사진 용량이 너무 커서 저장할 수 없어요. 사진 몇 장을 지워 주세요.';render();return}
  ui.saving=true;render();
  try{sessionStorage.setItem('sns-pending',JSON.stringify(state))}catch(e){}
  try{await ui.art.publish(doc);try{sessionStorage.removeItem('sns-pending')}catch(e){}}
  catch(e){ui.saving=false;const c=e&&e.code;
    if(c==='conflict')ui.msg='다른 곳에서 먼저 저장되어 최신 버전을 불러와요.';
    else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'){ui.canEdit=false;ui.edit=false;ui.dirty=false;ui.msg=''}
    else if(c==='rate_limited')ui.msg='저장 요청이 많아요. 잠시 후 다시 저장해 주세요.';
    else ui.msg='저장하지 못했어요. 잠시 후 다시 눌러 주세요.';
    render()}
}

/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);
if(h==='search'||h==='me'||h==='following'||h==='inbox'||h==='notif')ui.view=h;
else if(acctById(h)){ui.view='profile';ui.acct=h}
render();
loadSettings();loadCm();trackVisit();loadRemoteDm();
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const [art,usr]=await Promise.all([claude.use('artifact'),claude.use('user')]);
  if(!art||!usr)return;if(!(await usr.canEdit()))return;
  ui.art=art;ui.canEdit=true;
  try{const pend=sessionStorage.getItem('sns-pending');if(pend){const ps=JSON.parse(pend);sessionStorage.removeItem('sns-pending');
    if(JSON.stringify(ps.accounts)!==JSON.stringify(state.accounts)||JSON.stringify(ps.me)!==JSON.stringify(state.me)){state=ps;ui.dirty=true;ui.edit=true;ui.msg='저장되지 않은 변경사항을 되살렸어요. 다시 저장해 주세요.'}}}catch(e){}
  render();
}catch(e){}})();
})();
</script>
</body></html>
