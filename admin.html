<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>관리 페이지</title>
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#111;--muted:#737373;--line:#e3e3e3;--accent:#1d3a8a;--danger:#c0392b;--me:#3c64e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#18181b;--fg:#f2f2f2;--muted:#9a9aa2;--line:#2c2c31;--accent:#8fb0ff;--danger:#ff7b6b;--me:#4c74f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 16px}
h2{font-size:17px;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 10px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:4px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cm{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cm:first-child{border-top:0}
.cm img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--line)}
.cm b{font-weight:600}
.cm .acts{display:flex;gap:6px;margin-top:6px}
.reader{border-top:1px solid var(--line);padding:12px 0}
.reader:first-child{border-top:0}
.thread{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.b{max-width:78%;padding:7px 12px;border-radius:18px;background:var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.b.me{background:var(--me);color:#fff;align-self:flex-end}
.msg{min-height:20px;font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px}
.card .k{font-size:13px;color:var(--muted)}
.card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.card .s{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
table.st{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:7px 6px;border-top:1px solid var(--line);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px}
table.st tr.today td{font-weight:700}
table.st th,table.st td{white-space:nowrap}
.more{display:block;width:100%;margin-top:10px}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tot div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--muted)}
.tot b{display:block;font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.tot small{display:block;font-size:12px;font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column;gap:6px}
.rbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px}
.rbtn .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rbtn[aria-expanded="true"]{border-color:var(--accent)}
.rbody{padding:4px 2px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>한여름 밤의 꿈 · 관리</h1>

<section id="login">
  <h2>관리자 로그인</h2>
  <form id="lf">
    <label>이메일<input id="em" type="email" autocomplete="username" required></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
    <div class="row"><button class="primary">로그인</button><span class="msg" id="lmsg"></span></div>
  </form>
</section>

<div id="panel" hidden>
  <div class="row" style="justify-content:space-between;margin:0 0 12px"><span class="muted" id="who"></span><button id="out">로그아웃</button></div>

  <section>
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">방문자 통계</h2><button id="st-reload">새로고침</button></div>
    <p class="muted" style="margin:4px 0 12px">하루에 한 기기를 한 명으로 세요. 날짜는 한국 시간 기준이에요. 누적 횟수는 날마다 센 인원을 모두 더한 값이에요.</p>
    <div class="cards" id="st-cards"></div>
    <div style="overflow-x:auto"><table class="st" id="st-table"></table></div>
    <div id="st-more" hidden>
      <h3 style="font-size:15px;margin:16px 0 0">총 누적</h3>
      <div class="tot" id="st-total"></div>
    </div>
    <button class="more" id="st-toggle" aria-expanded="false">더보기 · 14일과 총 누적 보기</button>
  </section>

  <section>
    <h2>상단 로고 글자</h2>
    <label>독자용 SNS<input id="app-reader" maxlength="40"></label>
    <label>이안의 SNS<input id="app-ian" maxlength="40"></label>
    <div class="row"><button class="primary" id="save-app">저장</button><span class="msg" id="amsg"></span></div>
  </section>

  <section>
    <h2>독자 댓글</h2>
    <div class="tabs" id="cm-tabs"><button data-site="reader" class="on">독자용 SNS</button><button data-site="ian">이안의 SNS</button></div>
    <div id="cms"><p class="muted">불러오는 중…</p></div>
  </section>

  <section>
    <h2>독자들이 지우에게 보낸 DM</h2>
    <p class="muted" style="margin-top:-4px">이안의 SNS에서 독자가 이안이 되어 보낸 메시지예요. 독자 본인과 관리자만 볼 수 있어요.</p>
    <div id="dms"><p class="muted">불러오는 중…</p></div>
  </section>
</div>
</main>
<script src="vendor/supabase.js"></script>
<script>
(function(){
const SB=window.supabase.createClient('https://casrgrsudvyddxxjhron.supabase.co','sb_publishable_HAeJK5TfpsrhxzCmpkU2XA_HYefYMla');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
let posts={},cmSite='reader',cmRows=[];
fetch('data/posts.json').then(r=>r.json()).then(j=>{posts=j;renderCms()}).catch(()=>{});

async function start(){
  const {data}=await SB.auth.getSession();const u=data.session&&data.session.user;
  if(!u||u.is_anonymous){$('#login').hidden=false;$('#panel').hidden=true;return}
  const {data:adm}=await SB.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();
  if(!adm){$('#lmsg').textContent='관리자로 등록되지 않은 계정이에요.';await SB.auth.signOut();$('#login').hidden=false;$('#panel').hidden=true;return}
  $('#login').hidden=true;$('#panel').hidden=false;$('#who').textContent=u.email+' 로 로그인됨';
  loadApp();loadCms();loadDms();loadStats();
}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lmsg').textContent='로그인 중…';
  const {error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lmsg').textContent='이메일이나 비밀번호가 맞지 않아요.';return}$('#lmsg').textContent='';start()};
$('#out').onclick=async()=>{await SB.auth.signOut();location.reload()};

async function loadApp(){const {data}=await SB.from('settings').select('site,app_name');(data||[]).forEach(r=>{const i=$('#app-'+r.site);if(i)i.value=r.app_name})}
$('#save-app').onclick=async()=>{$('#amsg').textContent='저장 중…';
  for(const site of ['reader','ian']){const v=$('#app-'+site).value.trim()||'midsummer';
    const {error}=await SB.from('settings').update({app_name:v,updated_at:new Date().toISOString()}).eq('site',site);
    if(error){$('#amsg').textContent='저장하지 못했어요: '+error.message;return}}
  $('#amsg').textContent='저장했어요. 페이지를 새로고침하면 바뀌어 있어요.'};

$('#cm-tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cmSite=b.dataset.site;document.querySelectorAll('#cm-tabs button').forEach(x=>x.classList.toggle('on',x===b));loadCms()};
async function loadCms(){$('#cms').innerHTML='<p class="muted">불러오는 중…</p>';
  const {data,error}=await SB.from('comments').select('id,post_id,author,text,created_at').eq('site',cmSite).order('created_at',{ascending:false}).limit(1000);
  if(error){$('#cms').innerHTML='<p class="muted">불러오지 못했어요.</p>';return}cmRows=data;renderCms()}
function renderCms(){if(!$('#cms'))return;if(!cmRows.length){$('#cms').innerHTML='<p class="muted">아직 독자 댓글이 없어요.</p>';return}
  const P=posts[cmSite]||{};
  $('#cms').innerHTML=cmRows.map(c=>{const p=P[c.post_id]||{};return `<div class="cm" data-id="${c.id}">${p.thumb?`<img src="${esc(p.thumb)}" alt="">`:'<img alt="">'}<div>
    <div class="muted">${esc(p.acct||'')} 게시물${p.caption?` · ${esc(p.caption)}`:''} · ${when(c.created_at)}</div>
    <div class="view"><b>${esc(c.author)}</b> ${esc(c.text)}</div>
    <div class="acts"><button data-a="edit">수정</button><button class="danger" data-a="del">삭제</button></div></div></div>`}).join('')}
$('#cms').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const box=b.closest('.cm');const id=box.dataset.id;const c=cmRows.find(x=>x.id===id);
  if(b.dataset.a==='del'){if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='한 번 더 누르면 삭제';return}
    const {error}=await SB.from('comments').delete().eq('id',id);if(error){b.textContent='실패';return}loadCms();return}
  if(b.dataset.a==='edit'){box.querySelector('.view').innerHTML=`<input class="ea" value="${esc(c.author)}" maxlength="30"><textarea class="et" maxlength="300" rows="2">${esc(c.text)}</textarea>`;
    b.dataset.a='save';b.textContent='저장';return}
  if(b.dataset.a==='save'){const author=box.querySelector('.ea').value.trim(),text=box.querySelector('.et').value.trim();if(!author||!text)return;
    const {error}=await SB.from('comments').update({author,text}).eq('id',id);if(error){b.textContent='실패';return}loadCms()}};

async function loadDms(){const {data,error}=await SB.from('dms').select('reader,from_me,text,created_at').eq('thread','jiwoo').order('created_at',{ascending:true}).limit(10000);
  if(error){$('#dms').innerHTML='<p class="muted">불러오지 못했어요.</p>';return}
  if(!data.length){$('#dms').innerHTML='<p class="muted">아직 보낸 독자가 없어요.</p>';return}
  const g=new Map();data.forEach(r=>{if(!g.has(r.reader))g.set(r.reader,[]);g.get(r.reader).push(r)});
  const order=[...g.keys()].sort((a,b)=>g.get(a)[0].created_at.localeCompare(g.get(b)[0].created_at));const num=new Map(order.map((k,i)=>[k,i+1]));
  const list=[...g.entries()].sort((a,b)=>b[1][b[1].length-1].created_at.localeCompare(a[1][a[1].length-1].created_at));
  $('#dms').innerHTML=`<p class="muted">독자 ${list.length}명 · 최근에 보낸 순서예요. 누르면 대화가 열려요.</p><div class="rlist">`+list.map(([k,rows])=>`<div><button class="rbtn" aria-expanded="false" data-r="${num.get(k)}"><b>독자 ${num.get(k)}</b><span class="t">${when(rows[rows.length-1].created_at)} · 보낸 메시지 ${rows.filter(r=>r.from_me).length}개</span></button>
    <div class="rbody" hidden><div class="muted" style="font-size:12px">첫 메시지 ${when(rows[0].created_at)}</div><div class="thread">${rows.map(r=>`<div class="b ${r.from_me?'me':''}">${esc(r.text)}</div>`).join('')}</div></div></div>`).join('')+'</div>'}
$('#dms').onclick=e=>{const b=e.target.closest('.rbtn');if(!b)return;const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open);b.nextElementSibling.hidden=!open};

const SITES=[['reader','독자의 SNS','독자'],['ian','이안의 SNS','이안'],['home','첫 화면','첫 화면']];
const kday=off=>new Date(Date.now()+9*3600e3-off*864e5).toISOString().slice(0,10);
let stMore=false,stData=null;
$('#st-reload').onclick=()=>loadStats();
$('#st-toggle').onclick=()=>{stMore=!stMore;renderStats()};
async function loadStats(){
  const [r1,r2]=await Promise.all([SB.rpc('visit_stats',{p_days:14}),SB.rpc('visit_totals')]);
  if(r1.error){$('#st-cards').innerHTML='';$('#st-table').innerHTML='';$('#st-total').textContent='통계를 불러오지 못했어요. stats.sql을 실행했는지 확인해 주세요.';return}
  stData={r1:r1.data||[],r2:r2.data||[]};renderStats()}
function renderStats(){if(!stData)return;const r1={data:stData.r1},r2={data:stData.r2};
  const m={};(r1.data||[]).forEach(r=>{m[r.site+'|'+r.day]=Number(r.visitors)});
  const g=(site,off)=>m[site+'|'+kday(off)]||0;
  $('#st-cards').innerHTML=SITES.slice(0,2).map(([k,n])=>`<div class="card"><div class="k">${n} · 오늘</div><div class="v">${g(k,0).toLocaleString('ko-KR')}명</div><div class="s">어제 ${g(k,1).toLocaleString('ko-KR')}명</div></div>`).join('');
  const N=stMore?14:7;let rows='';for(let i=0;i<N;i++){const d=kday(i);const [y,mo,da]=d.split('-');
    rows+=`<tr class="${i===0?'today':''}"><td>${+mo}월 ${+da}일${i===0?' (오늘)':i===1?' (어제)':''}</td>${SITES.map(([k])=>`<td>${g(k,i)}</td>`).join('')}</tr>`}
  $('#st-table').innerHTML=`<thead><tr><th>날짜</th>${SITES.map(([,,n])=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>`;
  const t={},v={};(r2.data||[]).forEach(r=>{t[r.site]=Number(r.visitors);v[r.site]=Number(r.visit_days)});
  $('#st-total').innerHTML=SITES.map(([k,n])=>`<div>${n}<b>${(v[k]||0).toLocaleString('ko-KR')}회</b><small>다녀간 기기 ${(t[k]||0).toLocaleString('ko-KR')}대</small></div>`).join('');
  $('#st-more').hidden=!stMore;const tg=$('#st-toggle');tg.textContent=stMore?'접기':'더보기 · 14일과 총 누적 보기';tg.setAttribute('aria-expanded',stMore);
}

start();
})();
</script>
</body>
</html>
