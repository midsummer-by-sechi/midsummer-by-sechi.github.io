<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>한여름 밤의 꿈</title>
<style>
:root{--bg:#0b0b0c;--fg:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);display:grid;place-items:center;min-height:100vh;min-height:100dvh;overflow:hidden}
#play{width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s;-webkit-tap-highlight-color:transparent}
#play:hover{background:rgba(255,255,255,.22)}
#play:active{transform:scale(.94)}
#play:focus-visible{outline:2px solid #fff;outline-offset:4px}
#play svg{margin-left:6px}
video{display:none;max-width:100vw;max-height:100vh;max-height:100dvh;width:auto;height:100vh;height:100dvh;object-fit:contain;background:#000}
body.on #play{display:none}
body.on video{display:block}
</style>
</head>
<body>
<button id="play" aria-label="재생"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
<video id="v" src="reply.mp4" playsinline controls preload="metadata"></video>
<script src="../vendor/supabase.js"></script>
<script>
(function(){
  const b=document.getElementById('play'),v=document.getElementById('v');
  b.onclick=function(){document.body.classList.add('on');v.currentTime=0;const p=v.play();if(p&&p.catch)p.catch(function(){})};
  v.onended=function(){document.body.classList.remove('on');try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
  b.addEventListener('click',function(){track('video_play')});
  track('video');
  async function track(site){try{
    if(!window.supabase)return;
    const SB=window.__sb||(window.__sb=window.supabase.createClient('https://casrgrsudvyddxxjhron.supabase.co','sb_publishable_HAeJK5TfpsrhxzCmpkU2XA_HYefYMla'));
    const d=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);const k=site+':visit-day';
    try{if(localStorage.getItem(k)===d)return}catch(e){}
    const {data}=await SB.auth.getSession();if(data&&data.session&&data.session.user&&!data.session.user.is_anonymous)return;
    let id=null;try{id=localStorage.getItem('ms-visitor');if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('v'+Math.random().toString(36).slice(2)+Date.now().toString(36));localStorage.setItem('ms-visitor',id)}}catch(e){return}
    const r=await SB.from('visits').insert({site:site,visitor:id});if(!r.error||r.error.code==='23505'){try{localStorage.setItem(k,d)}catch(e){}}
  }catch(e){}}
})();
</script>
</body>
</html>
