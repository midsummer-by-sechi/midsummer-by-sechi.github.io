<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한여름 밤의 꿈</title>
<style>
:root{--bg:#f6f4ef;--fg:#1b1b1b;--muted:#77736a;--card:#fff;--line:#e4e0d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--fg:#efede8;--muted:#9b978e;--card:#1b1c1f;--line:#2d2e32}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px 16px}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
p{color:var(--muted);margin:0 0 28px}
a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;font-weight:600}
a small{display:block;font-weight:400;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<h1>한여름 밤의 꿈</h1>
<p>SNS로 보는 그 여름</p>
<a href="reader/">독자의 SNS<small>세 사람의 계정을 둘러보세요</small></a>
<a href="ian/">이안의 SNS<small>10월 7일, 이안의 휴대폰 속</small></a>
</main>
</body>
</html>
